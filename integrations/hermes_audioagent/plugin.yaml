name: audioagent
version: 0.7.1
description: "Submit WeChat outbound calls and deliver recent call transcripts or recordings from AudioAgent."
author: audioagents
kind: standalone
requires_env:
  - name: AUDIOAGENT_PROJECT_ID
    description: "AudioAgent Cloud-Parity project ID"
provides_tools:
  - audioagent_submit_outbound_task
  - audioagent_get_outbound_task
  - audioagent_wait_outbound_task
  - audioagent_cancel_outbound_task
  - audioagent_get_latest_call_transcript
  - audioagent_get_latest_call_recording
