# Template only. Do not commit real values; provision this Secret through your
# KMS/Vault/External Secrets controller and rotate service-token continuously.
apiVersion: v1
kind: Secret
metadata:
  name: cloud-parity-secrets
  namespace: qwen-telephony
type: Opaque
stringData:
  CLOUD_PARITY_DATABASE_URL: postgresql://USER:PASSWORD@postgres.example.com:5432/cloud_parity?sslmode=require
  CLOUD_PARITY_MASTER_KEY: REPLACE_WITH_FERNET_KEY
  CLOUD_PARITY_PHONE_HASH_KEY: REPLACE_WITH_32_PLUS_RANDOM_CHARACTERS
  CLOUD_PARITY_DISPATCH_METADATA_KEY: REPLACE_WITH_DISTINCT_FERNET_KEY
  CLOUD_PARITY_METRICS_TOKEN: REPLACE_WITH_32_PLUS_RANDOM_CHARACTERS
  LIVEKIT_URL: wss://livekit.example.com
  LIVEKIT_API_KEY: REPLACE
  LIVEKIT_API_SECRET: REPLACE
  DASHSCOPE_API_KEY: REPLACE
  # Omit static S3 keys when the Egress service uses workload identity.
  QWEN_RECORDING_S3_ACCESS_KEY: REPLACE_OR_REMOVE
  QWEN_RECORDING_S3_SECRET: REPLACE_OR_REMOVE
---
apiVersion: v1
kind: Secret
metadata:
  name: cloud-parity-service-token
  namespace: qwen-telephony
type: Opaque
stringData:
  service-token: REPLACE_WITH_SHORT_LIVED_OIDC_SERVICE_TOKEN
