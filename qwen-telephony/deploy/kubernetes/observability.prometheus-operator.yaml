# Requires Prometheus Operator CRDs. Metrics endpoints remain bearer protected;
# the operator reads the same externally managed Secret used by the workloads.
apiVersion: v1
kind: Service
metadata:
  name: telephony-dispatcher-metrics
  namespace: qwen-telephony
  labels:
    monitoring: cloud-parity-dispatcher
spec:
  selector:
    app: telephony-dispatcher
  ports:
    - name: metrics
      port: 9091
      targetPort: health
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloud-parity
  namespace: qwen-telephony
spec:
  selector:
    matchLabels:
      monitoring: cloud-parity-control
  namespaceSelector:
    matchNames: [qwen-telephony]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
      bearerTokenSecret:
        name: cloud-parity-secrets
        key: CLOUD_PARITY_METRICS_TOKEN
      relabelings:
        - targetLabel: component
          replacement: control-plane
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: telephony-dispatcher
  namespace: qwen-telephony
spec:
  selector:
    matchLabels:
      monitoring: cloud-parity-dispatcher
  namespaceSelector:
    matchNames: [qwen-telephony]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
      bearerTokenSecret:
        name: cloud-parity-secrets
        key: CLOUD_PARITY_METRICS_TOKEN
      relabelings:
        - targetLabel: component
          replacement: dispatcher
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloud-parity-telephony
  namespace: qwen-telephony
spec:
  groups:
    - name: cloud-parity-telephony
      rules:
        - alert: CloudParityControlPlaneDown
          expr: up{namespace="qwen-telephony",service="cloud-parity"} == 0
          for: 1m
          labels: {severity: critical}
          annotations: {summary: "Cloud-Parity control plane is unavailable"}
        - alert: TelephonyOutboundQueueStalled
          expr: telephony_queue_oldest_age_seconds > 300
          for: 5m
          labels: {severity: critical}
          annotations: {summary: "Oldest outbound call has waited over five minutes"}
        - alert: TelephonyStaleLeases
          expr: telephony_stale_leases > 0
          for: 2m
          labels: {severity: critical}
          annotations: {summary: "Expired call leases are not being recovered"}
        - alert: TelephonyDispatcherNotReady
          expr: telephony_dispatcher_ready == 0
          for: 2m
          labels: {severity: critical}
          annotations: {summary: "A dispatcher cannot poll the control plane"}
        - alert: TelephonyCallsStuckReconciling
          expr: telephony_calls{status="reconciling"} > 0
          for: 10m
          labels: {severity: critical}
          annotations: {summary: "Calls remain in reconciliation for over ten minutes"}
        - alert: TelephonyMandatoryRecordingFailure
          expr: telephony_recording_failures_recent > 0
          for: 1m
          labels: {severity: critical}
          annotations: {summary: "A managed call failed its recording policy"}
