apiVersion: v1
kind: Secret
metadata: {name: inbound-control-secrets, namespace: qwen-telephony}
type: Opaque
stringData:
  CLOUD_PARITY_DATABASE_URL: postgresql://user:replace-me@postgres.example.com:5432/cloud_parity
  CLOUD_PARITY_MASTER_KEY: replace-with-fernet-key
  CLOUD_PARITY_PHONE_HASH_KEY: replace-with-at-least-32-random-characters
  INBOUND_METADATA_SECRET: replace-with-independent-32-byte-random-secret
  INBOUND_WORKER_IDENTITIES_JSON: '{"public-worker":{"secret":"replace-public-32-byte-secret","scopes":["runtime:read","session:complete"]},"enterprise-worker":{"secret":"replace-enterprise-32-byte-secret","scopes":["runtime:read","sip:admit","session:complete"]},"dispatch-sync":{"secret":"replace-dispatch-32-byte-secret","scopes":["dispatch:sync"]},"maintenance":{"secret":"replace-maintenance-32-byte-secret","scopes":["maintenance:run"]}}'
  LIVEKIT_API_KEY: replace-me
  LIVEKIT_API_SECRET: replace-me
---
apiVersion: v1
kind: Secret
metadata: {name: inbound-public-worker-secrets, namespace: qwen-telephony}
type: Opaque
stringData:
  INBOUND_WORKER_SECRET: replace-public-32-byte-secret
  LIVEKIT_API_KEY: replace-me
  LIVEKIT_API_SECRET: replace-me
  DASHSCOPE_API_KEY: replace-me
---
apiVersion: v1
kind: Secret
metadata: {name: inbound-dispatch-sync-secrets, namespace: qwen-telephony}
type: Opaque
stringData:
  INBOUND_WORKER_SECRET: replace-dispatch-32-byte-secret
  LIVEKIT_API_KEY: replace-me
  LIVEKIT_API_SECRET: replace-me
---
apiVersion: v1
kind: Secret
metadata: {name: inbound-maintenance-secrets, namespace: qwen-telephony}
type: Opaque
stringData:
  INBOUND_WORKER_SECRET: replace-maintenance-32-byte-secret
---
apiVersion: v1
kind: Secret
metadata: {name: inbound-enterprise-worker-secrets, namespace: qwen-telephony}
type: Opaque
stringData:
  INBOUND_WORKER_SECRET: replace-enterprise-32-byte-secret
  LIVEKIT_API_KEY: replace-me
  LIVEKIT_API_SECRET: replace-me
  DASHSCOPE_API_KEY: replace-me
